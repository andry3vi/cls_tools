[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clstools"
version = "0.5.0"
description = "set of tool to load and sort IGISOL cls data"
authors = [
    {name = "Oiggart", email = "andrea.raggio@kuleuven.be"}
]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pandas",
    "dask[complete]",
    "asdf",
    "numpy",
    "matplotlib"
]

[dependency-groups]
# Deliberately just pytest. ruff is run through `uvx` at a version pinned in
# .github/workflows/ci.yml, so the lockfile stays small and a tool upgrade is
# an explicit edit to a CI file.
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/andry3vi/cls_tools"
Repository = "https://github.com/andry3vi/cls_tools"
Issues = "https://github.com/andry3vi/cls_tools/issues"

[tool.setuptools.packages.find]
include = ["clstools*"]

[tool.setuptools.package-data]
clstools = ["*.py"]

# ===========================================================================
# Tooling. Enforced by .github/workflows/ci.yml.
# ===========================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["clstools", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort -- deterministic import order
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "NPY",      # numpy-specific
    "RUF",      # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["clstools"]

# ---------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["clstools"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Neither ships stubs or a py.typed marker; asdf's tree access and most of
# pandas's API surface resolve to Any either way, so ignoring here is a no-op
# for how precisely they can be checked, not a suppressed real finding.
module = ["asdf.*", "pandas.*"]
ignore_missing_imports = true
